name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify explicit issue-selection UI contract
        run: npm run test:phase71:ui
      - name: Verify auth onboarding contract
        run: npm run test:auth:onboarding
      - name: Verify global money contract
        run: npm run test:localization
      - name: Verify workspace mutation contract
        run: npm run test:workspace-mutations

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.112.0
      - name: Start local Supabase
        run: supabase start
      - name: Reset local database
        run: supabase db reset
      - name: Run pgTAP database tests
        run: supabase test db
      - name: Run Auth and RLS integration tests
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          npm run db:test:auth
      - name: Run circulation integration tests
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          npm run db:test:circulation
      - name: Run global launch idempotency and localization integration tests
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          npm run db:test:global-launch
      - name: Run Phase 7.1 integration tests
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          npm run db:test:phase71
      - name: Run explicit-selection issue integration tests
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          npm run db:test:phase71:issue-selection
      - name: Run Phase 7.1 multi-active-enrollment upgrade regression
        shell: bash
        run: npm run db:test:phase71:upgrade
      - name: Run legacy-fine upgrade regression
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          npm run db:test:legacy-fines-upgrade
      - name: Lint local database
        run: supabase db lint --local --schema public --level error --fail-on error
      - name: Verify generated public database types
        shell: bash
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.ts
          sed -i '${/^$/d;}' /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts
      - name: Upload generated public database types for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase71-generated-database-types
          path: /tmp/database.ts
      - name: Stop local Supabase
        if: always()
        run: supabase stop

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.112.0
      - name: Start local Supabase
        run: supabase start
      - name: Reset local database
        run: supabase db reset
      - name: Create synthetic confirmed browser users
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          node scripts/seed-e2e.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production Next server
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="${SUPABASE_URL:-$API_URL}"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${SUPABASE_ANON_KEY:-$ANON_KEY}"
          export NEXT_PUBLIC_SITE_URL="http://127.0.0.1:3000"
          export SUPABASE_LOCAL_TEST_MODE="true"
          npm run build
      - name: Run Playwright browser tests
        shell: bash
        run: |
          set -a
          source <(supabase status -o env)
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="${SUPABASE_URL:-$API_URL}"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${SUPABASE_ANON_KEY:-$ANON_KEY}"
          export NEXT_PUBLIC_SITE_URL="http://127.0.0.1:3000"
          export SUPABASE_LOCAL_TEST_MODE="true"
          npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
      - name: Stop local Supabase
        if: always()
        run: supabase stop
